name: Coupang Deal Pusher

on:
  schedule:
    # 보조 안전망 (주 실행은 Cloudflare Worker Cron */5 * * * * 에서 workflow_dispatch 트리거)
    - cron: '*/30 * * * *'
  # Cloudflare Worker Cron 및 수동 [Run workflow] 트리거
  workflow_dispatch:

concurrency:
  group: coupang-deal-pusher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor fonts-nanum

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore SQLite Price History & OCR Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            price_history.db
            ocr_cache.json
          key: deal-pusher-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deal-pusher-state-

      - name: Run Deal Pusher
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_REPORT_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORT_CHANNEL_ID }}
          CLICK_TRACKER_BASE_URL: ${{ secrets.CLICK_TRACKER_BASE_URL }}
          CLICK_TRACKER_API_KEY: ${{ secrets.CLICK_TRACKER_API_KEY }}
        run: |
          python push_deals.py

      - name: Checkpoint SQLite Price History DB
        if: always()
        run: |
          python -c "import os, sqlite3
          p = 'price_history.db'
          if os.path.exists(p):
              c = sqlite3.connect(p)
              c.execute('PRAGMA wal_checkpoint(TRUNCATE);')
              c.commit()
              c.close()"

      - name: Save SQLite Price History & OCR Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            price_history.db
            ocr_cache.json
          key: deal-pusher-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and push updated seen deals & sales tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in seen_deals.json sales_tracker.json post_quota.json flyer_queue.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen deals and sales tracker [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
